[package]
name = "doc-router"
version = "0.1.0"
edition = "2021"
description = "Semantic router for agent documentation: decide what to read, not read everything."
license = "MIT OR Apache-2.0"
repository = "https://github.com/YOUR_USER/doc-router"
keywords = ["agents", "documentation", "llm", "mcp", "context"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "doc-router"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
pulldown-cmark = { version = "0.10", default-features = false }
anyhow = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
